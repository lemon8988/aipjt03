# 백엔드(FastAPI) 배포 설정 (Render). 키 값은 대시보드 Environment 에서 직접 입력한다.
services:
  - type: web
    name: meeting-planner-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_BASE_URL
        value: https://gms.ssafy.io/gmsapi/generativelanguage.googleapis.com/v1beta
      - key: LLM_MODEL
        value: gemini-2.5-flash-lite
      - key: KAKAO_REST_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
